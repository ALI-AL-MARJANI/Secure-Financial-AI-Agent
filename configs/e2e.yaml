# End-to-end RAG evaluation (retrieval -> generation -> local LLM judge). Everything runs on Ollama.
split: test
retrieval_config: configs/agent.yaml        # uses its `retrieval` block (dense + title prefix)
generators:                                  # Ollama tags; pull them first (see RUNBOOK.md)
  - mistral                                  # Mistral 7B Instruct v0.3
  - llama3.1:8b
  - qwen2.5:7b
generation: {temperature: 0.0, seed: 0, num_ctx: 8192}
judge:
  model: qwen2.5:7b          # answers generated by the judge's own model are flagged as self-judged
  base_url: http://localhost:11434/v1
  temperature: 0.0
  max_tokens: 2048
embeddings: BAAI/bge-small-en-v1.5           # for RAGAS answer relevancy
ragas_metrics: [faithfulness, answer_relevancy, context_precision, context_recall]
bootstrap: {n_boot: 2000, seed: 0}
