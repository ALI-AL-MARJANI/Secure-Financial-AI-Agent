# Golden QA set over 12 CFR Parts 1005 (Reg E), 1030 (Reg DD), 229 (Reg CC), eCFR issue 2026-10-05.
#
# Provenance: every item was DRAFTED BY AN LLM (Claude, Anthropic) from the passage text and has
# `reviewed: false` until a human checks it with scripts/review_golden.py (see docs/annotation_guide.md).
# `evidence` strings are verbatim quotes that scripts/build_golden.py checks against the gold passages.
#
# types: single = answer in one passage (or one passage + its official interpretation)
#        multi  = answer needs passages from two different paragraphs/sections
#        unanswerable = in-domain question the corpus does not answer; expected behaviour is to abstain
version: v0-draft
items:
# ---------------------------------------------------------------- Regulation E (EFT)
- id: E001
  type: single
  question: "Under Regulation E, what counts as an access device?"
  gold: ["1005.2(a)(1)"]
  evidence: ["a card, code, or other means of access to a consumer's account"]
  answer: "A card, code, or other means of access to a consumer's account (or a combination) that the consumer can use to initiate electronic fund transfers."
- id: E002
  type: single
  question: "When does a debit card become an accepted access device?"
  gold: ["1005.2(a)(2)"]
  evidence: ["Requests and receives, or signs, or uses (or authorizes another to use) the access device"]
  answer: "When the consumer requests and receives, signs, or uses (or authorizes another to use) it to transfer money or obtain goods, requests validation of an unsolicited device, or receives it as a renewal or substitute for an accepted device."
- id: E003
  type: single
  question: "Which kinds of consumer accounts are covered by the definition of account in Regulation E?"
  gold: ["1005.2(b)(1)"]
  evidence: ["demand deposit (checking), savings, or other consumer asset account"]
  answer: "Checking (demand deposit), savings, or other consumer asset accounts held by a financial institution and established primarily for personal, family, or household purposes."
- id: E004
  type: single
  question: "Is an account held under a bona fide trust agreement an account for Regulation E purposes?"
  gold: ["1005.2(b)(2)"]
  evidence: ["does not include an account held by a financial institution under a bona fide trust agreement"]
  answer: "No. The term account does not include an account held by a financial institution under a bona fide trust agreement."
- id: E005
  type: single
  question: "Is a payroll card account treated as a prepaid account under Regulation E?"
  gold: ["1005.2(b)(3)"]
  evidence: ["A “payroll card account,” which is an account that is directly or indirectly established through an employer"]
  answer: "Yes. A payroll card account, established through an employer to receive recurring wage payments by EFT, is one of the types of prepaid account."
- id: E006
  type: single
  question: "How does Regulation E define a business day?"
  gold: ["1005.2(d)"]
  evidence: ["any day on which the offices of the consumer's financial institution are open to the public for carrying on substantially all business functions"]
  answer: "Any day on which the institution's offices are open to the public for carrying on substantially all business functions."
- id: E007
  type: single
  question: "Who is a consumer under Regulation E?"
  gold: ["1005.2(e)"]
  evidence: ["“Consumer” means a natural person."]
  answer: "A natural person."
- id: E008
  type: single
  question: "Is a telephone operated by the consumer an electronic terminal?"
  gold: ["1005.2(h)"]
  evidence: ["an electronic device, other than a telephone operated by a consumer"]
  answer: "No. An electronic terminal is an electronic device other than a telephone operated by a consumer, such as a POS terminal or ATM."
- id: E009
  type: single
  question: "What is a preauthorized electronic fund transfer?"
  gold: ["1005.2(k)"]
  evidence: ["authorized in advance to recur at substantially regular intervals"]
  answer: "An EFT authorized in advance to recur at substantially regular intervals."
- id: E010
  type: single
  question: "If I gave my debit card to my roommate, are transfers they make considered unauthorized?"
  gold: ["1005.2(m)(1)", "1005.SuppI.009"]
  evidence: ["By a person who was furnished the access device to the consumer's account by the consumer, unless the consumer has notified the financial institution"]
  answer: "No. Transfers by a person to whom the consumer furnished the access device are not unauthorized unless the consumer has notified the institution that transfers by that person are no longer authorized."
- id: E011
  type: single
  question: "Are fraudulent transfers initiated by a bank employee unauthorized transfers for which the consumer can be liable?"
  gold: ["1005.SuppI.009", "1005.2(m)(3)"]
  evidence: ["A consumer has no liability for erroneous or fraudulent transfers initiated by an employee of a financial institution."]
  answer: "The consumer has no liability for erroneous or fraudulent transfers initiated by an employee of the financial institution."
- id: E012
  type: single
  question: "Does Regulation E cover payments made by paper check?"
  gold: ["1005.3(c)(1)"]
  evidence: ["Any transfer of funds originated by check, draft, or similar paper instrument"]
  answer: "No. Transfers originated by check, draft, or similar paper instrument are excluded from the definition of electronic fund transfer."
- id: E013
  type: single
  question: "Are Fedwire transfers covered by Regulation E?"
  gold: ["1005.3(c)(3)"]
  evidence: ["Any transfer of funds through Fedwire or through a similar wire transfer system"]
  answer: "No. Transfers through Fedwire or similar wire systems used primarily between financial institutions or businesses are excluded."
- id: E014
  type: single
  question: "When is a telephone-initiated transfer excluded from Regulation E?"
  gold: ["1005.3(c)(6)"]
  evidence: ["Is initiated by a telephone communication between a consumer and a financial institution making the transfer"]
  answer: "When it is initiated by a telephone communication between the consumer and the institution and does not take place under a telephone bill-payment or other written plan contemplating periodic or recurring transfers."
- id: E015
  type: single
  question: "What asset threshold exempts a small institution from Regulation E for preauthorized transfers?"
  gold: ["1005.3(c)(7)"]
  evidence: ["$100 million or less on the preceding December 31"]
  answer: "Preauthorized transfers are exempt if the account-holding institution had assets of $100 million or less on the preceding December 31."
- id: E016
  type: single
  question: "Can Regulation E disclosures be given in Spanish instead of English?"
  gold: ["1005.4(a)(2)"]
  evidence: ["may be made in a language other than English, provided that the disclosures are made available in English upon the consumer's request"]
  answer: "Yes, provided the disclosures are made available in English upon the consumer's request."
- id: E017
  type: single
  question: "For a joint account, does the bank have to send Regulation E disclosures to each account holder?"
  gold: ["1005.4(c)"]
  evidence: ["need provide only one set of the required disclosures and may provide them to any of the account holders"]
  answer: "No. It needs to provide only one set of disclosures, to any of the account holders."
- id: E018
  type: single
  question: "When may a financial institution issue a debit card to a consumer who did not ask for one?"
  gold: ["1005.5(b)"]
  evidence: ["may distribute an access device to a consumer on an unsolicited basis if the access device is"]
  answer: "Only if the device is not validated, is accompanied by an explanation of how to dispose of it and by the required disclosures, and is validated only on the consumer's request after identity verification."
- id: E019
  type: single
  question: "What must happen before an unsolicited access device can be validated?"
  gold: ["1005.5(b)(4)"]
  evidence: ["Validated only in response to the consumer's oral or written request for validation, after the institution has verified the consumer's identity by a reasonable means"]
  answer: "It can be validated only in response to the consumer's oral or written request, after the institution has verified the consumer's identity by reasonable means."
- id: E020
  type: single
  question: "What is my maximum liability if I report my lost debit card within two business days?"
  gold: ["1005.6(b)(1)"]
  evidence: ["the consumer's liability shall not exceed the lesser of $50 or the amount of unauthorized transfers that occur before notice to the financial institution"]
  answer: "The lesser of $50 or the amount of unauthorized transfers that occurred before notice."
- id: E021
  type: single
  question: "What is the liability cap if I wait more than two business days to report a stolen card?"
  gold: ["1005.6(b)(2)"]
  evidence: ["the consumer's liability shall not exceed the lesser of $500 or the sum of"]
  answer: "Up to the lesser of $500 or the sum of $50 (or the transfers in the first two business days, if less) plus the transfers after those two business days and before notice."
- id: E022
  type: single
  question: "How many days do I have to report an unauthorized transfer that appears on my periodic statement?"
  gold: ["1005.6(b)(3)"]
  evidence: ["within 60 days of the financial institution's transmittal of the statement to avoid liability for subsequent transfers"]
  answer: "60 days from the institution's transmittal of the statement; after that the consumer can be liable for later transfers the institution shows would not have occurred."
- id: E023
  type: single
  question: "Can the reporting deadline for unauthorized transfers be extended if I was in the hospital?"
  gold: ["1005.6(b)(4)"]
  evidence: ["due to extenuating circumstances, the institution shall extend the times specified above to a reasonable period"]
  answer: "Yes. If the delay was due to extenuating circumstances, the institution must extend the time limits to a reasonable period."
- id: E024
  type: single
  question: "In what ways can a consumer notify the bank of a lost card under Regulation E?"
  gold: ["1005.6(b)(5)"]
  evidence: ["The consumer may notify the institution in person, by telephone, or in writing."]
  answer: "In person, by telephone, or in writing."
- id: E025
  type: single
  question: "If state law gives me lower liability for unauthorized transfers than Regulation E, which applies?"
  gold: ["1005.6(b)(6)"]
  evidence: ["the consumer's liability shall not exceed the amount imposed under the state law or agreement"]
  answer: "The lower limit under state law or the account agreement applies."
- id: E026
  type: single
  question: "When must a bank give the initial Regulation E disclosures?"
  gold: ["1005.7(a)"]
  evidence: ["at the time a consumer contracts for an electronic fund transfer service or before the first electronic fund transfer is made"]
  answer: "When the consumer contracts for an EFT service or before the first EFT involving the account."
- id: E027
  type: single
  question: "Do initial EFT disclosures have to mention ATM operator fees?"
  gold: ["1005.7(b)(11)"]
  evidence: ["A notice that a fee may be imposed by an automated teller machine operator"]
  answer: "Yes. They must include a notice that a fee may be imposed by an ATM operator, and by any network used, for transfers or balance inquiries."
- id: E028
  type: single
  question: "How much advance notice must a bank give before increasing EFT fees?"
  gold: ["1005.8(a)"]
  evidence: ["at least 21 days before the effective date"]
  answer: "Written notice at least 21 days before the effective date."
- id: E029
  type: single
  question: "How often must a bank send the error resolution notice under Regulation E?"
  gold: ["1005.8(b)"]
  evidence: ["at least once each calendar year, an error resolution notice"]
  answer: "At least once each calendar year (or an abbreviated notice with each periodic statement)."
- id: E030
  type: single
  question: "Must an ATM give me a receipt for a $10 withdrawal?"
  gold: ["1005.9(e)"]
  evidence: ["if the amount of the transfer is $15 or less"]
  answer: "No. The receipt requirement does not apply if the transfer is $15 or less."
- id: E031
  type: single
  question: "How many digits of my account number must an ATM receipt show?"
  gold: ["1005.9(a)(4)"]
  evidence: ["need not exceed four digits or letters"]
  answer: "The identifying number or code need not exceed four digits or letters."
- id: E032
  type: single
  question: "How often must a bank send periodic statements for an account with electronic transfers?"
  gold: ["1005.9(b)"]
  evidence: ["for each monthly cycle in which an electronic fund transfer has occurred; and shall send a periodic statement at least quarterly if no transfer has occurred"]
  answer: "For each monthly cycle with an EFT, and at least quarterly if no transfer has occurred."
- id: E033
  type: single
  question: "How must a bank let me know that a recurring direct deposit was received?"
  gold: ["1005.10(a)"]
  evidence: ["Providing oral or written notice of the transfer within two business days after the transfer occurs"]
  answer: "By positive notice within two business days, negative notice within two business days if it did not occur, or a readily available telephone line disclosed to the consumer."
- id: E034
  type: single
  question: "How must recurring debits from my account be authorized?"
  gold: ["1005.10(b)"]
  evidence: ["may be authorized only by a writing signed or similarly authenticated by the consumer"]
  answer: "Only by a writing signed or similarly authenticated by the consumer, with a copy provided to the consumer."
- id: E035
  type: single
  question: "How far in advance must I notify the bank to stop a preauthorized payment?"
  gold: ["1005.10(c)"]
  evidence: ["at least three business days before the scheduled date of the transfer"]
  answer: "At least three business days before the scheduled date, orally or in writing."
- id: E036
  type: single
  question: "If I place an oral stop-payment order, how long do I have to confirm it in writing?"
  gold: ["1005.10(c)"]
  evidence: ["within 14 days of an oral notification"]
  answer: "The bank may require written confirmation within 14 days; otherwise the oral order stops being binding after 14 days."
- id: E037
  type: single
  question: "How much notice is required when a preauthorized debit varies in amount?"
  gold: ["1005.10(d)"]
  evidence: ["at least 10 days before the scheduled date of transfer"]
  answer: "Written notice of the amount and date at least 10 days before the scheduled transfer."
- id: E038
  type: single
  question: "Can a lender require me to repay a loan by automatic debit as a condition of the loan?"
  gold: ["1005.10(e)"]
  evidence: ["may condition an extension of credit to a consumer on the consumer's repayment by preauthorized electronic fund transfers"]
  answer: "No, except for credit under an overdraft credit plan or credit extended to maintain a specified minimum balance."
- id: E039
  type: single
  question: "Does an unauthorized electronic fund transfer count as an error under Regulation E?"
  gold: ["1005.11(a)"]
  evidence: ["(i) An unauthorized electronic fund transfer;"]
  answer: "Yes. The definition of error includes an unauthorized EFT."
- id: E040
  type: single
  question: "How long do I have to notify my bank of an error on my statement?"
  gold: ["1005.11(b)"]
  evidence: ["no later than 60 days after the institution sends the periodic statement"]
  answer: "The notice must be received no later than 60 days after the institution sends the statement on which the error first appears."
- id: E041
  type: single
  question: "How long does a bank have to investigate an EFT error before it must provisionally credit my account?"
  gold: ["1005.11(c)"]
  evidence: ["shall determine whether an error occurred within 10 business days of receiving a notice of error"]
  answer: "10 business days; it may take up to 45 days if it provisionally credits the account within 10 business days."
- id: E042
  type: single
  question: "What is the longest a bank can take to investigate an EFT error if it provisionally credits the account?"
  gold: ["1005.11(c)"]
  evidence: ["may take up to 45 days from receipt of a notice of error"]
  answer: "Up to 45 days from receipt of the notice, provided it provisionally credits within 10 business days."
- id: E043
  type: single
  question: "Can the bank keep part of the provisional credit when investigating an unauthorized transfer?"
  gold: ["1005.11(c)"]
  evidence: ["may withhold a maximum of $50 from the amount credited"]
  answer: "Yes, a maximum of $50, if it has a reasonable basis to believe an unauthorized transfer occurred and § 1005.6(a) is satisfied."
- id: E044
  type: single
  question: "After the bank finds no error, can I see the documents it relied on?"
  gold: ["1005.11(d)(1)"]
  evidence: ["shall note the consumer's right to request the documents that the institution relied on"]
  answer: "Yes. The written explanation must note the right to request them, and the bank must promptly provide copies on request."
- id: E045
  type: single
  question: "When a bank reverses a provisional credit, for how long must it keep honoring checks?"
  gold: ["1005.11(d)(2)"]
  evidence: ["for five business days after the notification"]
  answer: "For five business days after notifying the consumer, without overdraft charges, for items it would have paid."
- id: E046
  type: single
  question: "How long must records of Regulation E compliance be retained?"
  gold: ["1005.13(b)"]
  evidence: ["for a period of not less than two years"]
  answer: "Not less than two years from the date disclosures are required or action is required."
- id: E047
  type: single
  question: "When must an ATM operator show its fee to the consumer?"
  gold: ["1005.16(c)"]
  evidence: ["before the consumer is committed to paying a fee"]
  answer: "On the ATM screen or on paper, before the consumer is committed to paying the fee."
- id: E048
  type: single
  question: "Can an ATM operator charge a fee if the consumer was not shown a fee notice?"
  gold: ["1005.16(d)"]
  evidence: ["may impose a fee on a consumer for initiating an electronic fund transfer or a balance inquiry only if"]
  answer: "No. It may charge only if the required notice was provided and the consumer elected to continue."
- id: E049
  type: single
  question: "Is a transfer from my savings account to cover an overdraft an overdraft service under Regulation E?"
  gold: ["1005.17(a)(2)"]
  evidence: ["A service that transfers funds from another account held individually or jointly by a consumer, such as a savings account"]
  answer: "No. A service that transfers funds from another account of the consumer, such as savings, is excluded."
- id: E050
  type: single
  question: "Can a bank charge an overdraft fee on a one-time debit card purchase without my consent?"
  gold: ["1005.17(b)"]
  evidence: ["shall not assess a fee or charge on a consumer's account for paying an ATM or one-time debit card transaction"]
  answer: "No. It must give notice, a reasonable opportunity to opt in, obtain affirmative consent, and confirm it in writing."
- id: E051
  type: single
  question: "Can a bank refuse to pay my checks because I did not opt in to debit card overdraft coverage?"
  gold: ["1005.17(b)"]
  evidence: ["Decline to pay checks, ACH transactions, and other types of transactions that overdraw the consumer's account"]
  answer: "No. It cannot decline to pay checks, ACH, or other transactions because the consumer did not opt in for ATM and one-time debit card overdrafts."
- id: E052
  type: single
  question: "On a joint account, whose consent counts for overdraft opt-in?"
  gold: ["1005.17(e)"]
  evidence: ["shall treat the affirmative consent of any of the joint consumers as affirmative consent for that account"]
  answer: "Consent (or revocation) by any one of the joint holders applies to the account."
- id: E053
  type: single
  question: "Can I revoke my overdraft opt-in, and how fast must the bank act?"
  gold: ["1005.17(f)"]
  evidence: ["must implement a consumer's revocation of consent as soon as reasonably practicable"]
  answer: "Yes, at any time; the bank must implement it as soon as reasonably practicable."
- id: E054
  type: single
  question: "How long does an overdraft opt-in last?"
  gold: ["1005.17(g)"]
  evidence: ["effective until revoked by the consumer, or unless the financial institution terminates the service"]
  answer: "Until the consumer revokes it or the institution terminates the service."
- id: E055
  type: single
  question: "What account history must a prepaid card issuer provide if it does not send periodic statements?"
  gold: ["1005.18(c)"]
  evidence: ["covers at least 12 months preceding the date the consumer electronically accesses the account"]
  answer: "Balance by telephone, an electronic history covering at least 12 months, and a written history on request covering at least 24 months."
- id: E056
  type: single
  question: "From what date did the Regulation E prepaid account rules apply?"
  gold: ["1005.18(h)"]
  evidence: ["beginning April 1, 2019"]
  answer: "April 1, 2019."
- id: E057
  type: single
  question: "What is the difference between a store gift card and a general-use prepaid card?"
  gold: ["1005.20(a)(2)", "1005.20(a)(3)"]
  evidence: ["Redeemable upon presentation at multiple, unaffiliated merchants for goods or services, or usable at automated teller machines"]
  answer: "A store gift card is redeemable at a single merchant or affiliated group; a general-use prepaid card is redeemable at multiple unaffiliated merchants or usable at ATMs."
- id: E058
  type: single
  question: "When can a dormancy fee be charged on a gift card?"
  gold: ["1005.20(d)(1)", "1005.20(d)(2)", "1005.20(d)(3)"]
  evidence: ["no activity with respect to the certificate or card, in the one-year period ending on the date on which the fee is imposed"]
  answer: "Only after one year with no activity, if the fee terms are disclosed on the card, and no more than one such fee per calendar month."
- id: E059
  type: single
  question: "How many dormancy fees can be charged on a gift card in one month?"
  gold: ["1005.20(d)(3)"]
  evidence: ["Not more than one dormancy, inactivity, or service fee is imposed in any given calendar month."]
  answer: "Not more than one in any calendar month."
- id: E060
  type: single
  question: "What is the minimum expiration period for the funds on a gift card?"
  gold: ["1005.20(e)(2)"]
  evidence: ["Five years after the date the gift certificate was initially issued"]
  answer: "At least five years after issuance (or the last load for a store gift card or general-use prepaid card), or the card expiration date if later."
- id: E061
  type: single
  question: "Are paper-only gift certificates covered by the gift card rules?"
  gold: ["1005.20(b)(5)"]
  evidence: ["Issued in paper form only; or"]
  answer: "No. Cards or devices issued in paper form only are excluded."
- id: E062
  type: single
  question: "Can an issuer charge me to replace an expired gift card that still has funds?"
  gold: ["1005.20(e)(4)"]
  evidence: ["No fee or charge is imposed on the cardholder for replacing the gift certificate"]
  answer: "No, unless the card was lost or stolen."
- id: E063
  type: single
  question: "What is a remittance transfer under Regulation E?"
  gold: ["1005.30(e)"]
  evidence: ["the electronic transfer of funds requested by a sender to a designated recipient that is sent by a remittance transfer provider"]
  answer: "An electronic transfer of funds requested by a sender to a designated recipient in a foreign country, sent by a remittance transfer provider."
- id: E064
  type: single
  question: "Who is the designated recipient of a remittance transfer?"
  gold: ["1005.30(c)"]
  evidence: ["any person specified by the sender as the authorized recipient of a remittance transfer to be received at a location in a foreign country"]
  answer: "Any person the sender specifies as the authorized recipient of the transfer at a location in a foreign country."
- id: E065
  type: single
  question: "How long does a sender have to report an error on an international remittance?"
  gold: ["1005.33(b)"]
  evidence: ["no later than 180 days after the disclosed date of availability of the remittance transfer"]
  answer: "180 days after the disclosed date of availability."
- id: E066
  type: single
  question: "How long does a remittance transfer provider have to investigate an error?"
  gold: ["1005.33(c)"]
  evidence: ["determine whether an error occurred within 90 days of receiving a notice of error"]
  answer: "90 days from receiving the notice, reporting results within three business days after completing the investigation."
- id: E067
  type: single
  question: "How long after paying can I cancel an international money transfer?"
  gold: ["1005.34(a)"]
  evidence: ["no later than 30 minutes after the sender makes payment"]
  answer: "Within 30 minutes of payment, if the funds have not been picked up or deposited."
- id: E068
  type: single
  question: "How quickly must a remittance provider refund a cancelled transfer, and does that include fees?"
  gold: ["1005.34(b)"]
  evidence: ["within three business days of receiving a sender's request to cancel the remittance transfer"]
  answer: "Within three business days, including fees and, where not prohibited by law, taxes."
- id: E069
  type: single
  question: "Is a remittance provider responsible for violations committed by its agent?"
  gold: ["1005.35"]
  evidence: ["A remittance transfer provider is liable for any violation of this subpart by an agent when such agent acts for the provider."]
  answer: "Yes, when the agent acts for the provider."
- id: E070
  type: single
  question: "How far in advance must I cancel a scheduled remittance transfer?"
  gold: ["1005.36(c)(2)"]
  evidence: ["at least three business days before the scheduled date of the remittance transfer"]
  answer: "The request must be received at least three business days before the scheduled date."
- id: E071
  type: single
  question: "When must the remittance pre-payment disclosure be provided?"
  gold: ["1005.31(e)"]
  evidence: ["when the sender requests the remittance transfer, but prior to payment for the transfer"]
  answer: "When the sender requests the transfer, before payment."
- id: E072
  type: single
  question: "If I give the wrong account number for a remittance, can I lose my money?"
  gold: ["1005.33(h)(3)"]
  evidence: ["the sender could lose the transfer amount"]
  answer: "Possibly. The incorrect-account-number exception applies if the provider meets conditions including prior notice that the sender could lose the transfer amount and reasonable efforts to recover it."
- id: E073
  type: single
  question: "Does a PIN count as an access device?"
  gold: ["1005.SuppI.001"]
  evidence: ["includes debit cards, personal identification numbers (PINs)"]
  answer: "Yes. Access devices include debit cards, PINs, telephone transfer and bill payment codes."
- id: E074
  type: single
  question: "If my bank is open Saturday only for teller transactions, is Saturday a business day?"
  gold: ["1005.SuppI.006"]
  evidence: ["then Saturday is not a business day for that institution"]
  answer: "No, if it does not perform substantially all business functions (including back-office functions such as investigating errors) on Saturday."
- id: E075
  type: single
  question: "Does the two-business-day reporting window include the day I discover my card is missing?"
  gold: ["1005.SuppI.028"]
  evidence: ["The two business day period does not include the day the consumer learns of the loss or theft"]
  answer: "No. It excludes the day the consumer learns of the loss and any non-business day."
- id: E076
  type: single
  question: "My card was stolen Monday and I reported it Friday; $100 was taken Tuesday and $600 Thursday. What is my liability?"
  gold: ["1005.SuppI.029"]
  evidence: ["the consumer's total liability is $500 ($50 of the $100 transfer plus $450 of the $600 transfer, in this example)"]
  answer: "$500: $50 of the $100 transfer plus $450 of the $600 transfer."
- id: E077
  type: single
  question: "Can a family member report my lost card if I am in the hospital?"
  gold: ["1005.SuppI.032"]
  evidence: ["Notice to a financial institution by a person acting on the consumer's behalf is considered valid"]
  answer: "Yes. Notice by a person acting on the consumer's behalf is valid; the bank may ask for documentation."
- id: E078
  type: single
  question: "Is my notice of error valid if I don't include my account number?"
  gold: ["1005.SuppI.073"]
  evidence: ["The notice of error is effective even if it does not contain the consumer's account number"]
  answer: "Yes, as long as the institution can identify the account, for example by Social Security number."
- id: E079
  type: single
  question: "If a merchant resubmits a debit after I placed a stop-payment order, must the bank still block it?"
  gold: ["1005.SuppI.067"]
  evidence: ["If the debit item is resubmitted, the institution must continue to honor the stop-payment order"]
  answer: "Yes. The institution must continue to honor the stop-payment order if the debit is resubmitted."
- id: E080
  type: single
  question: "Is a withdrawal I was forced to make at an ATM at gunpoint an unauthorized transfer?"
  gold: ["1005.SuppI.009"]
  evidence: ["An EFT at an ATM is an unauthorized transfer if the consumer has been induced by force to initiate the transfer."]
  answer: "Yes. An ATM transfer the consumer was induced by force to make is unauthorized."
- id: E081
  type: single
  question: "If I paid cash for a remittance and then cancelled, can the provider refund me by check?"
  gold: ["1005.SuppI.236"]
  evidence: ["if a sender initially provided cash for the remittance transfer, a provider may issue a refund by check"]
  answer: "Yes. If the sender paid cash, the provider may refund by check."
# ---------------------------------------------------------------- Regulation DD (Truth in Savings)
- id: D001
  type: single
  question: "Does Regulation DD apply to credit unions?"
  gold: ["1030.1(c)"]
  evidence: ["This part applies to depository institutions except for credit unions."]
  answer: "No. It applies to depository institutions except credit unions (though its advertising rules apply to anyone advertising accounts of depository institutions)."
- id: D002
  type: single
  question: "What is the purpose of the Truth in Savings regulation?"
  gold: ["1030.1(b)"]
  evidence: ["to enable consumers to make informed decisions about accounts at depository institutions"]
  answer: "To enable consumers to make informed decisions and meaningful comparisons about deposit accounts through required disclosures."
- id: D003
  type: single
  question: "What is the annual percentage yield?"
  gold: ["1030.2(c)"]
  evidence: ["a percentage rate reflecting the total amount of interest paid on an account, based on the interest rate and the frequency of compounding for a 365-day period"]
  answer: "A percentage rate reflecting total interest paid on an account, based on the interest rate and compounding frequency over 365 days, calculated per appendix A."
- id: D004
  type: single
  question: "Above what value does a gift for opening an account count as a bonus under Regulation DD?"
  gold: ["1030.2(f)"]
  evidence: ["worth more than $10"]
  answer: "More than $10 given or offered during a year."
- id: D005
  type: single
  question: "How does Regulation DD define a business day?"
  gold: ["1030.2(g)"]
  evidence: ["a calendar day other than a Saturday, a Sunday, or any of the legal public holidays"]
  answer: "A calendar day other than a Saturday, Sunday, or legal public holiday."
- id: D006
  type: single
  question: "What makes an account a fixed-rate account under Truth in Savings?"
  gold: ["1030.2(l)"]
  evidence: ["contracts to give at least 30 calendar days advance written notice of decreases in the interest rate"]
  answer: "The institution contracts to give at least 30 calendar days' advance written notice of interest rate decreases."
- id: D007
  type: single
  question: "What is a grace period on a certificate of deposit?"
  gold: ["1030.2(m)"]
  evidence: ["a period following the maturity of an automatically renewing time account during which the consumer may withdraw funds without being assessed a penalty"]
  answer: "A period after maturity of an automatically renewing time account during which the consumer can withdraw without penalty."
- id: D008
  type: single
  question: "What is the minimum maturity for a time account under Regulation DD?"
  gold: ["1030.2(u)"]
  evidence: ["an account with a maturity of at least seven days"]
  answer: "At least seven days."
- id: D009
  type: single
  question: "What is a tiered-rate account?"
  gold: ["1030.2(t)"]
  evidence: ["two or more interest rates that are applicable to specified balance levels"]
  answer: "An account with two or more interest rates applicable to specified balance levels."
- id: D010
  type: single
  question: "What is a stepped-rate account?"
  gold: ["1030.2(s)"]
  evidence: ["two or more interest rates that take effect in succeeding periods and are known when the account is opened"]
  answer: "An account with two or more rates that take effect in succeeding periods and are known at opening."
- id: D011
  type: single
  question: "How often must statements be sent to count as periodic statements under Regulation DD?"
  gold: ["1030.2(q)"]
  evidence: ["provided to a consumer on a regular basis four or more times a year"]
  answer: "On a regular basis four or more times a year."
- id: D012
  type: single
  question: "If I ask a bank teller about savings rates over the phone, which rate must they quote?"
  gold: ["1030.3(e)"]
  evidence: ["the depository institution shall state the annual percentage yield"]
  answer: "The annual percentage yield; the interest rate may be added, but no other rate."
- id: D013
  type: single
  question: "How precisely must the APY be stated?"
  gold: ["1030.3(f)"]
  evidence: ["rounded to the nearest one-hundredth of one percentage point (.01%) and expressed to two decimal places"]
  answer: "Rounded to the nearest 0.01% and expressed to two decimal places; it is accurate within 0.05%."
- id: D014
  type: single
  question: "If an account has two owners, must Truth in Savings disclosures be sent to both?"
  gold: ["1030.3(d)"]
  evidence: ["disclosures may be made to any one of the consumers"]
  answer: "No. Disclosures may be made to any one of the consumers."
- id: D015
  type: single
  question: "When must account disclosures be provided if I open an account online?"
  gold: ["1030.4(a)"]
  evidence: ["the disclosures required under paragraph (a)(1) of this section must be provided before the account is opened or the service is provided"]
  answer: "Before the account is opened or the service is provided."
- id: D016
  type: single
  question: "If I open an account by mail, how long does the bank have to send the disclosures?"
  gold: ["1030.4(a)"]
  evidence: ["no later than 10 business days after the account is opened or the service is provided"]
  answer: "No later than 10 business days after opening (or the service is provided), whichever is earlier."
- id: D017
  type: single
  question: "What must a CD disclosure say about early withdrawal penalties?"
  gold: ["1030.4(b)(6)"]
  evidence: ["A statement that a penalty will or may be imposed for early withdrawal, how it is calculated, and the conditions for its assessment"]
  answer: "That a penalty will or may be imposed, how it is calculated, and the conditions for its assessment."
- id: D018
  type: single
  question: "What must be disclosed about an account opening bonus?"
  gold: ["1030.4(b)(7)"]
  evidence: ["The amount or type of any bonus, when the bonus will be provided, and any minimum balance and time requirements to obtain the bonus"]
  answer: "The amount or type of bonus, when it will be provided, and any minimum balance and time requirements."
- id: D019
  type: single
  question: "How much notice must a bank give before a change that lowers my savings APY?"
  gold: ["1030.5(a)"]
  evidence: ["at least 30 calendar days before the effective date of the change"]
  answer: "At least 30 calendar days before the effective date (no notice needed for variable-rate changes, check printing fees, or time accounts of one month or less)."
- id: D020
  type: single
  question: "Does a bank need to notify me when the rate on my variable-rate account drops?"
  gold: ["1030.5(a)"]
  evidence: ["Changes in the interest rate and corresponding changes in the annual percentage yield in variable-rate accounts"]
  answer: "No. Rate changes on variable-rate accounts are exempt from the advance notice requirement."
- id: D021
  type: single
  question: "When must a bank send the maturity notice for an automatically renewing one-year CD?"
  gold: ["1030.5(b)"]
  evidence: ["at least 30 calendar days before maturity of the existing account"]
  answer: "At least 30 calendar days before maturity, or at least 20 calendar days before the end of a grace period of at least five calendar days."
- id: D022
  type: single
  question: "What notice is required before maturity of a two-year CD that does not renew automatically?"
  gold: ["1030.5(c)"]
  evidence: ["at least 10 calendar days before maturity of the existing account"]
  answer: "Disclosure of the maturity date and whether interest is paid after maturity, at least 10 calendar days before maturity."
- id: D023
  type: single
  question: "What yield figure must appear on a savings periodic statement?"
  gold: ["1030.6(a)(1)"]
  evidence: ["The “annual percentage yield earned” during the statement period"]
  answer: "The annual percentage yield earned during the statement period."
- id: D024
  type: single
  question: "On what balance must interest be calculated, and what daily rate is the minimum?"
  gold: ["1030.7(a)"]
  evidence: ["Institutions shall calculate interest by use of a daily rate of at least 1/365 of the interest rate."]
  answer: "On the full principal each day using the daily balance or average daily balance method, with a daily rate of at least 1/365 of the interest rate (1/366 allowed in leap years)."
- id: D025
  type: single
  question: "Does Regulation DD require interest to be compounded monthly?"
  gold: ["1030.7(b)"]
  evidence: ["This section does not require institutions to compound or credit interest at any particular frequency."]
  answer: "No. It does not require any particular compounding or crediting frequency."
- id: D026
  type: single
  question: "Can a bank advertise a checking account as free if it charges a monthly maintenance fee?"
  gold: ["1030.8(a)(2)"]
  evidence: ["Refer to or describe an account as “free” or “no cost” (or contain a similar term) if any maintenance or activity fee may be imposed"]
  answer: "No. An account cannot be called free or no cost if any maintenance or activity fee may be imposed."
- id: D027
  type: single
  question: "Can a bank advertisement call interest profit?"
  gold: ["1030.8(a)(2)"]
  evidence: ["The word “profit” shall not be used in referring to interest paid on an account."]
  answer: "No. The word profit shall not be used to refer to interest."
- id: D028
  type: single
  question: "Which rate must a savings advertisement use when it states a rate of return?"
  gold: ["1030.8(b)"]
  evidence: ["it shall state the rate as an “annual percentage yield” using that term"]
  answer: "The annual percentage yield; the interest rate may appear only with, and not more conspicuously than, the APY."
- id: D029
  type: single
  question: "Do radio ads for savings accounts have to include all the APY-related disclosures?"
  gold: ["1030.8(e)"]
  evidence: ["Broadcast or electronic media, such as television or radio"]
  answer: "No. Broadcast and electronic media ads such as radio are exempt from several of the additional disclosures."
- id: D030
  type: single
  question: "How long must a bank keep evidence of compliance with Truth in Savings?"
  gold: ["1030.9(c)"]
  evidence: ["for a minimum of two years after the date disclosures are required to be made"]
  answer: "At least two years after the disclosures were required or action was required."
- id: D031
  type: single
  question: "What overdraft fee totals must appear on my periodic statement?"
  gold: ["1030.11(a)"]
  evidence: ["must be provided for the statement period and for the calendar year-to-date"]
  answer: "Total overdraft fees and total returned item fees, for the statement period and for the calendar year to date."
- id: D032
  type: single
  question: "Can the balance shown at an ATM include the bank's overdraft coverage amount?"
  gold: ["1030.11(c)"]
  evidence: ["the balance may not include additional amounts that the institution may provide to cover an item when there are insufficient or unavailable funds"]
  answer: "No. An automated balance may not include overdraft coverage amounts, though an additional, clearly labelled balance may be shown."
- id: D033
  type: single
  question: "Does Regulation DD cover an account held at a bank outside the United States by a U.S. resident?"
  gold: ["1030.SuppI.002"]
  evidence: ["Accounts held in an institution located outside the United States are not covered, even if held by a U.S. resident."]
  answer: "No. Accounts at institutions located outside the United States are not covered."
# ---------------------------------------------------------------- Regulation CC (funds availability, Check 21)
- id: C001
  type: single
  question: "When must cash I deposit with a teller be available?"
  gold: ["229.10(a)"]
  evidence: ["not later than the business day after the banking day on which the cash is deposited, if the deposit is made in person to an employee"]
  answer: "No later than the business day after the banking day of deposit."
- id: C002
  type: single
  question: "When must cash deposited at an ATM be available?"
  gold: ["229.10(a)"]
  evidence: ["not later than the second business day after the banking day on which the cash is deposited, if the deposit is not made in person"]
  answer: "No later than the second business day after the banking day of deposit, since it is not made in person to an employee."
- id: C003
  type: single
  question: "When must a direct deposit or other electronic payment be available for withdrawal?"
  gold: ["229.10(b)"]
  evidence: ["not later than the business day after the banking day on which the bank received the electronic payment"]
  answer: "No later than the business day after the banking day on which the bank received it."
- id: C004
  type: single
  question: "How fast must funds from a U.S. Treasury check deposited by the payee be available?"
  gold: ["229.10(c)"]
  evidence: ["A check drawn on the Treasury of the United States and deposited in an account held by a payee of the check"]
  answer: "No later than the business day after the banking day of deposit."
- id: C005
  type: single
  question: "When must funds from a local check be available?"
  gold: ["229.12(b)"]
  evidence: ["not later than the second business day following the banking day on which funds are deposited"]
  answer: "No later than the second business day following the banking day of deposit."
- id: C006
  type: single
  question: "What is the maximum hold for a nonlocal check under the availability schedule?"
  gold: ["229.12(c)"]
  evidence: ["not later than the fifth business day following the banking day on which funds are deposited"]
  answer: "Funds must be available no later than the fifth business day after the banking day of deposit."
- id: C007
  type: single
  question: "Can a bank delay cash withdrawals of check funds by an extra day?"
  gold: ["229.12(d)"]
  evidence: ["may extend by one business day the time that funds deposited in an account by one or more checks"]
  answer: "Yes, by one business day for cash or similar withdrawals, but $550 must be available by 5:00 p.m. on the normal availability day."
- id: C008
  type: single
  question: "When are checks deposited at a nonproprietary ATM available?"
  gold: ["229.12(f)"]
  evidence: ["not later than the fifth business day following the banking day on which the funds are deposited"]
  answer: "No later than the fifth business day following the banking day of deposit."
- id: C009
  type: single
  question: "For how long is an account considered new for funds availability purposes?"
  gold: ["229.13(a)(2)"]
  evidence: ["during the first 30 calendar days after the account is established"]
  answer: "During the first 30 calendar days after it is established, unless each customer already had another account at the bank for at least 30 days."
- id: C010
  type: single
  question: "Above what amount can a bank place a longer hold on large check deposits?"
  gold: ["229.13(b)"]
  evidence: ["in excess of $6,725 on any one banking. day"]
  answer: "For the aggregate amount of check deposits in excess of $6,725 on any one banking day."
- id: C011
  type: single
  question: "When can a bank treat my account as repeatedly overdrawn for availability purposes?"
  gold: ["229.13(d)(1)", "229.13(d)(2)"]
  evidence: ["On six or more banking days within the preceding six months, the account balance is negative"]
  answer: "If the balance was negative on six or more banking days in the preceding six months, or negative by $6,725 or more on two or more banking days."
- id: C012
  type: single
  question: "Does the availability schedule apply to a check that bounced and was redeposited?"
  gold: ["229.13(c)"]
  evidence: ["do not apply to a check that has been returned unpaid and redeposited"]
  answer: "No, except for checks returned for a missing indorsement or for being postdated once corrected."
- id: C013
  type: single
  question: "Can a bank extend holds because of a computer outage?"
  gold: ["229.13(f)(1)"]
  evidence: ["An interruption of communications or computer or other equipment facilities;"]
  answer: "Yes. Emergency conditions such as an interruption of communications or computer facilities allow an exception, if the bank exercises due diligence."
- id: C014
  type: single
  question: "What information must a notice of a deposit hold exception contain?"
  gold: ["229.13(g)"]
  evidence: ["The reason the exception was invoked"]
  answer: "An account number or code, the date and amount of the deposit being delayed, the reason the exception was invoked, and when the funds will be available."
- id: C015
  type: single
  question: "When must interest begin to accrue on a check deposit to an interest-bearing account?"
  gold: ["229.14(a)"]
  evidence: ["not later than the business day on which the depositary bank receives credit for the funds"]
  answer: "No later than the business day on which the depositary bank receives credit for the funds."
- id: C016
  type: single
  question: "How must a bank describe the day funds become available in its disclosures?"
  gold: ["229.15(b)"]
  evidence: ["the __________ business day after"]
  answer: "As available on 'the ___ business day after' the day of deposit."
- id: C017
  type: single
  question: "Must a bank send funds availability disclosures to holders of dormant accounts?"
  gold: ["229.15(d)"]
  evidence: ["A bank need not give availability disclosures to a customer that holds a dormant or inactive account."]
  answer: "No."
- id: C018
  type: single
  question: "When must a bank give its funds availability policy to a new customer?"
  gold: ["229.17"]
  evidence: ["Before opening a new account, a bank shall provide a potential customer with the applicable specific availability policy disclosure"]
  answer: "Before opening the new account."
- id: C019
  type: single
  question: "What notice must appear on preprinted deposit slips?"
  gold: ["229.18(a)"]
  evidence: ["a notice that deposits may not be available for immediate withdrawal"]
  answer: "A notice that deposits may not be available for immediate withdrawal."
- id: C020
  type: single
  question: "How much notice must a bank give before making its funds availability policy slower?"
  gold: ["229.18(e)"]
  evidence: ["at least 30 days before implementing a change to the bank's availability policy"]
  answer: "At least 30 days before implementation; a change that speeds up availability may be disclosed within 30 days after."
- id: C021
  type: single
  question: "When are funds deposited at an off-premises ATM considered deposited?"
  gold: ["229.19(a)(4)"]
  evidence: ["are considered deposited on the day the funds are removed from the ATM, if funds normally are removed from the ATM not more than two times each week"]
  answer: "On the day the funds are removed from the ATM, if it is more than 50 feet from the bank's premises and normally emptied no more than twice a week."
- id: C022
  type: single
  question: "What is the earliest cut-off hour a bank may set for teller deposits?"
  gold: ["229.19(a)(5)"]
  evidence: ["of 2:00 p.m. or later"]
  answer: "2:00 p.m. or later for teller deposits (12:00 noon or later for ATMs, contractual branches, or off-premise facilities)."
- id: C023
  type: single
  question: "At what time of day must funds be available on their availability date?"
  gold: ["229.19(b)(1)"]
  evidence: ["9:00 a.m. (local time of the depositary bank); or"]
  answer: "By the later of 9:00 a.m. local time or when teller facilities (including ATMs) are available for withdrawals."
- id: C024
  type: single
  question: "Can a bank place a hold on my other funds that is larger than the deposited check?"
  gold: ["229.19(e)"]
  evidence: ["The amount of funds that are held exceeds the amount of the check"]
  answer: "No. It may not hold other funds in excess of the check amount or beyond the availability times."
- id: C025
  type: single
  question: "What damages can an individual recover from a bank that violates the funds availability rules?"
  gold: ["229.21(a)(2)"]
  evidence: ["not be less than $125 nor greater than $1,350"]
  answer: "Actual damages plus additional damages of not less than $125 nor more than $1,350 in an individual action, plus costs and attorney's fees."
- id: C026
  type: single
  question: "Within what time must a lawsuit for a Regulation CC availability violation be filed?"
  gold: ["229.21(d)"]
  evidence: ["within one year after the date of the occurrence of the violation involved"]
  answer: "Within one year after the violation."
- id: C027
  type: single
  question: "What legend must a substitute check carry to be the legal equivalent of the original?"
  gold: ["229.51(a)(2)"]
  evidence: ["This is a legal copy of your check. You can use it the same way you would use the original check."]
  answer: "'This is a legal copy of your check. You can use it the same way you would use the original check.'"
- id: C028
  type: single
  question: "How long do I have to file an expedited recredit claim for a substitute check?"
  gold: ["229.54(b)(1)"]
  evidence: ["by the end of the 40th calendar day after the later of the calendar day on which the bank mailed or delivered"]
  answer: "The bank must receive the claim by the end of the 40th calendar day after it mailed or delivered the statement or the substitute check, whichever is later."
- id: C029
  type: single
  question: "If my bank has not resolved my substitute check claim after 10 business days, what must it do?"
  gold: ["229.54(c)(3)"]
  evidence: ["up to the lesser of the amount of the substitute check or $2,500"]
  answer: "Recredit up to the lesser of the check amount or $2,500 (plus interest) by the end of that day, and the remainder by the 45th calendar day."
- id: C030
  type: single
  question: "When must recredited funds from a substitute check claim be available?"
  gold: ["229.54(d)"]
  evidence: ["no later than the start of the business day after the banking day on which the bank provides the recredit"]
  answer: "No later than the start of the next business day after the recredit, subject to safeguard exceptions."
- id: C031
  type: single
  question: "What must a bank's substitute check disclosure to consumers describe?"
  gold: ["229.57(a)"]
  evidence: ["describes—"]
  answer: "That a substitute check is the legal equivalent of an original check and the consumer's recredit rights for improperly charged substitute checks."
- id: C032
  type: single
  question: "What amount of a mixed check deposit must be available the next business day under the minimum next-day rule effective July 2025?"
  gold: ["229.11(c)"]
  evidence: ["Effective July 1, 2025, the amount is $275."]
  answer: "$275 (effective July 1, 2025)."
# ---------------------------------------------------------------- multi-passage
- id: M001
  type: multi
  question: "What is my liability if I report a lost card within two business days, and what happens if I don't report an unauthorized transfer on my statement within 60 days?"
  gold: ["1005.6(b)(1)", "1005.6(b)(3)"]
  evidence: ["the lesser of $50 or the amount of unauthorized transfers", "within 60 days of the financial institution's transmittal of the statement"]
  answer: "Within two business days: the lesser of $50 or the transfers before notice. Not reporting within 60 days of the statement exposes the consumer to unlimited liability for later transfers that timely notice would have prevented."
- id: M002
  type: multi
  question: "Compare the $50 and $500 liability tiers for a stolen debit card."
  gold: ["1005.6(b)(1)", "1005.6(b)(2)"]
  evidence: ["the lesser of $50 or the amount of unauthorized transfers", "the lesser of $500 or the sum of"]
  answer: "$50 tier applies if notice is given within two business days of learning of the loss; otherwise up to $500."
- id: M003
  type: multi
  question: "What is the deadline to report an EFT error and how long can the bank take to resolve it?"
  gold: ["1005.11(b)", "1005.11(c)"]
  evidence: ["no later than 60 days after the institution sends the periodic statement", "may take up to 45 days from receipt of a notice of error"]
  answer: "Report within 60 days of the statement; the bank has 10 business days, or up to 45 days with provisional credit."
- id: M004
  type: multi
  question: "How do I stop a recurring payment and what notice do I get if its amount changes?"
  gold: ["1005.10(c)", "1005.10(d)"]
  evidence: ["at least three business days before the scheduled date of the transfer", "at least 10 days before the scheduled date of transfer"]
  answer: "Notify the bank at least three business days before the transfer; if the amount varies, written notice is due at least 10 days before."
- id: M005
  type: multi
  question: "What does a bank need before charging overdraft fees on debit card purchases, and how does this work on a joint account?"
  gold: ["1005.17(b)", "1005.17(e)"]
  evidence: ["Obtains the consumer's affirmative consent", "the affirmative consent of any of the joint consumers"]
  answer: "Notice and the consumer's affirmative opt-in with written confirmation; on a joint account, consent by any joint holder counts."
- id: M006
  type: multi
  question: "When can gift card funds expire and when can inactivity fees start?"
  gold: ["1005.20(e)(2)", "1005.20(d)(1)"]
  evidence: ["Five years after the date the gift certificate was initially issued", "in the one-year period ending on the date on which the fee is imposed"]
  answer: "Funds cannot expire for at least five years; dormancy fees require one year without activity."
- id: M007
  type: multi
  question: "How long do I have to cancel a remittance transfer and how fast is the refund?"
  gold: ["1005.34(a)", "1005.34(b)"]
  evidence: ["no later than 30 minutes after the sender makes payment", "within three business days of receiving a sender's request to cancel"]
  answer: "Cancel within 30 minutes of payment; refund within three business days including fees."
- id: M008
  type: multi
  question: "What are the time limits for reporting and investigating a remittance transfer error?"
  gold: ["1005.33(b)", "1005.33(c)"]
  evidence: ["no later than 180 days after the disclosed date of availability", "within 90 days of receiving a notice of error"]
  answer: "Report within 180 days of the disclosed availability date; the provider has 90 days to investigate."
- id: M009
  type: multi
  question: "How much advance notice is required for an adverse change in terms on a savings account versus on EFT services?"
  gold: ["1030.5(a)", "1005.8(a)"]
  evidence: ["at least 30 calendar days before the effective date of the change", "at least 21 days before the effective date"]
  answer: "Regulation DD: at least 30 calendar days; Regulation E: at least 21 days."
- id: M010
  type: multi
  question: "When does interest start accruing on a deposited check, according to both Truth in Savings and Regulation CC?"
  gold: ["1030.7(c)", "229.14(a)"]
  evidence: ["Interest shall begin to accrue not later than the business day specified", "not later than the business day on which the depositary bank receives credit for the funds"]
  answer: "Regulation DD points to Regulation CC: interest must accrue no later than the business day the bank receives credit for the funds."
- id: M011
  type: multi
  question: "If I deposit cash at my bank's ATM and a check at another bank's ATM, when is each available?"
  gold: ["229.10(a)", "229.12(f)"]
  evidence: ["not later than the second business day after the banking day on which the cash is deposited", "A depositary bank shall make funds deposited in an account at a nonproprietary ATM by cash or check available"]
  answer: "Cash not deposited with an employee: second business day. Deposits at a nonproprietary ATM: fifth business day."
- id: M012
  type: multi
  question: "What counts as a new account and how are large check deposits into it handled?"
  gold: ["229.13(a)(2)", "229.13(a)(1)"]
  evidence: ["during the first 30 calendar days after the account is established", "the ninth business day following the banking day on which funds are deposited"]
  answer: "The first 30 calendar days; next-day items are covered only for the first $6,725 per day, with the excess available by the ninth business day."
- id: M013
  type: multi
  question: "When does the large-deposit exception apply and what must the bank tell me when it uses it?"
  gold: ["229.13(b)", "229.13(g)"]
  evidence: ["in excess of $6,725 on any one banking. day", "it must provide the depositor with a written notice"]
  answer: "For check deposits above $6,725 in one banking day; the bank must give written notice with the reason and the availability date."
- id: M014
  type: multi
  question: "How long must banks keep compliance records under Regulations E, DD, and CC?"
  gold: ["1005.13(b)", "1030.9(c)", "229.21(g)"]
  evidence: ["for a period of not less than two years", "for a minimum of two years", "for not less than two years"]
  answer: "At least two years under each regulation."
- id: M015
  type: multi
  question: "What must my monthly statement show about electronic transfers and about overdraft fees?"
  gold: ["1005.9(b)", "1030.11(a)"]
  evidence: ["shall send a periodic statement for each monthly cycle", "using the term “Total Overdraft Fees;”"]
  answer: "Each EFT's details (amount, date, type, etc.) under Reg E, and total overdraft and returned item fees for the period and year to date under Reg DD."
- id: M016
  type: multi
  question: "Can account and EFT disclosures be given in a foreign language?"
  gold: ["1005.4(a)(2)", "1030.3(b)"]
  evidence: ["made available in English upon the consumer's request", "provided the disclosures are available in English upon request"]
  answer: "Yes under both regulations, provided English versions are available on request."
- id: M017
  type: multi
  question: "Is Saturday a business day under Regulation E and under Regulation DD?"
  gold: ["1005.2(d)", "1030.2(g)"]
  evidence: ["open to the public for carrying on substantially all business functions", "a calendar day other than a Saturday, a Sunday"]
  answer: "Under Reg E it depends on whether the institution carries on substantially all business functions; under Reg DD Saturday is never a business day."
- id: M018
  type: multi
  question: "What is the deadline to claim a substitute check recredit and what must the bank do if it hasn't decided in 10 business days?"
  gold: ["229.54(b)(1)", "229.54(c)(3)"]
  evidence: ["the 40th calendar day", "the lesser of the amount of the substitute check or $2,500"]
  answer: "Claim by the 40th calendar day; after 10 business days without decision the bank must recredit up to $2,500, and the rest by day 45."
- id: M019
  type: multi
  question: "Who has to tell me about ATM surcharges: my bank or the ATM operator?"
  gold: ["1005.7(b)(11)", "1005.16(b)"]
  evidence: ["A notice that a fee may be imposed by an automated teller machine operator", "must provide a notice that a fee will be imposed"]
  answer: "Both: the account-holding bank's initial disclosures warn that operators may charge, and the operator must disclose the fee amount before the consumer is committed."
- id: M020
  type: multi
  question: "How are recurring debits authorized and how can I stop one?"
  gold: ["1005.10(b)", "1005.10(c)"]
  evidence: ["a writing signed or similarly authenticated by the consumer", "at least three business days before the scheduled date of the transfer"]
  answer: "By a signed or authenticated writing; stop by notifying the bank at least three business days before the scheduled date."
- id: M021
  type: multi
  question: "What conditions must be met before a consumer can be held liable for unauthorized transfers, and what is the basic limit?"
  gold: ["1005.6(a)", "1005.6(b)(1)"]
  evidence: ["only if the financial institution has provided the disclosures required by § 1005.7(b)(1), (2), and (3)", "the lesser of $50"]
  answer: "The institution must have given the required liability disclosures (and, for access devices, an accepted device with a means of identification); the basic limit is $50 with timely notice."
- id: M022
  type: multi
  question: "What is a time account and when must the renewal notice be sent for one that renews automatically?"
  gold: ["1030.2(u)", "1030.5(b)"]
  evidence: ["an account with a maturity of at least seven days", "at least 30 calendar days before maturity of the existing account"]
  answer: "An account with a maturity of at least seven days; renewal disclosures at least 30 calendar days before maturity (or 20 days before the end of a 5+ day grace period)."
- id: M023
  type: multi
  question: "What rules apply to advertising savings rates and calling an account free?"
  gold: ["1030.8(b)", "1030.8(a)(2)"]
  evidence: ["state the rate as an “annual percentage yield” using that term", "if any maintenance or activity fee may be imposed"]
  answer: "Rates must be stated as APY; an account cannot be called free if maintenance or activity fees may be imposed."
- id: M024
  type: multi
  question: "Is a payroll card covered by Regulation E and does the issuer have to send monthly statements?"
  gold: ["1005.2(b)(3)", "1005.18(c)"]
  evidence: ["A “payroll card account,”", "need not furnish periodic statements required by § 1005.9(b)"]
  answer: "Yes, payroll card accounts are prepaid accounts; statements can be replaced by telephone balance, a 12-month electronic history and a 24-month written history on request."
- id: M025
  type: multi
  question: "When can a bank hold my existing funds because of a deposited check, and when must electronic deposits be available?"
  gold: ["229.19(e)", "229.10(b)"]
  evidence: ["may not place a hold on any funds of the customer at the bank", "the business day after the banking day on which the bank received the electronic payment"]
  answer: "It may not hold other funds beyond the check amount or availability times; electronic payments are available the next business day."
